name: Build Good Aura Melody V6

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure universal macOS build
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15

      - name: Build VST3
        run: |
          cmake --build build \
            --config Release \
            --parallel 2

      - name: Locate VST3
        shell: bash
        run: |
          echo "Searching for Good Aura Melody V6..."

          find build \
            -type d \
            -name "*.vst3" \
            -print

      - name: Package VST3
        shell: bash
        run: |
          set -e

          mkdir -p artifact

          VST3_PATH="$(find build -type d -name "*.vst3" | head -n 1)"

          if [ -z "$VST3_PATH" ]; then
            echo "ERROR: No .vst3 bundle was found."
            exit 1
          fi

          echo "Found VST3:"
          echo "$VST3_PATH"

          cp -R \
            "$VST3_PATH" \
            artifact/

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$VST3_PATH" \
            "artifact/GoodAuraMelody-V6-macOS-Universal.zip"

      - name: Verify plugin binary
        shell: bash
        run: |
          VST3_PATH="$(find build -type d -name "*.vst3" | head -n 1)"

          BINARY="$(find "$VST3_PATH/Contents/MacOS" -type f | head -n 1)"

          echo "Plugin:"
          echo "$VST3_PATH"

          echo "Binary:"
          echo "$BINARY"

          echo "Architecture:"
          file "$BINARY"

      - name: Ad-hoc sign test build
        shell: bash
        run: |
          VST3_PATH="$(find build -type d -name "*.vst3" | head -n 1)"

          codesign \
            --force \
            --deep \
            --sign - \
            "$VST3_PATH"

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "$VST3_PATH"

      - name: Repackage signed VST3
        shell: bash
        run: |
          set -e

          rm -rf artifact

          mkdir -p artifact

          VST3_PATH="$(find build -type d -name "*.vst3" | head -n 1)"

          cp -R \
            "$VST3_PATH" \
            artifact/

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$VST3_PATH" \
            "artifact/GoodAuraMelody-V6-macOS-Universal.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoodAuraMelody-V6-macOS-Universal
          path: artifact/
